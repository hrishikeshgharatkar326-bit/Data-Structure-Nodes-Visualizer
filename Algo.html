<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MemMap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed live galaxy; canvas fills screen; floating glass chrome only (logo, info, dock, planets, learn card). Single dark world by design. */
:root{--bg:#04050d;--glass:rgba(10,14,34,.66);--glass2:rgba(16,22,50,.9);--ln:rgba(150,170,255,.22);--tx:#e9edff;--mut:#97a3d3;--cy:#22d3ee;--vi:#a78bfa;--mg:#f472b6;--am:#fbbf24;
--ui:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;--hw:'Kalam','Segoe Print','Bradley Hand','Chalkboard SE',cursive;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 58%,#000b 100%)}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;z-index:1;outline:0}
.glass{background:var(--glass);border:1px solid var(--ln);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px;box-shadow:0 8px 40px #0007}
button{font:inherit;color:var(--tx);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mg);outline-offset:2px}
.top{position:fixed;z-index:6;top:calc(10px + env(safe-area-inset-top,0px))}
#logo{left:calc(12px + env(safe-area-inset-left,0px));padding:9px 15px;font-weight:600;letter-spacing:.6px;border-radius:14px;background:linear-gradient(120deg,#22d3ee33,#a78bfa44,#f472b633,#22d3ee33);background-size:300% 100%;animation:sh 8s linear infinite;border:1px solid var(--ln);text-shadow:0 0 12px #22d3ee}
@keyframes sh{to{background-position:300% 0}}
#bl{right:calc(12px + env(safe-area-inset-right,0px));padding:9px 15px;border-radius:14px;border:1px solid var(--ln);background:var(--glass);backdrop-filter:blur(14px)}
#bl.on{border-color:var(--am);color:var(--am);box-shadow:0 0 16px #fbbf2444}
#info{left:50%;transform:translateX(-50%);max-width:min(560px,calc(100% - 250px));padding:9px 16px;color:var(--mut);font-size:13px;text-align:center;min-height:38px;line-height:1.35}
#info.nar{color:var(--am);border-color:#fbbf2466;box-shadow:0 0 22px #fbbf2430;font-weight:500}
#selbar{top:calc(62px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-radius:14px}
#selbar b{color:var(--mg);font-weight:600;white-space:nowrap}
.chip{background:#ffffff0d;border:1px solid var(--ln);border-radius:10px;padding:6px 11px;transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--cy);box-shadow:0 0 12px #22d3ee44}.chip.dan{color:#fda4af;border-color:#fb718566}.chip.dan:hover{border-color:#fb7185;box-shadow:0 0 12px #fb718555}.chip.on{background:#22d3ee22;border-color:var(--cy);color:var(--cy)}
#dock{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:3px;padding:6px;max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
.ib{width:40px;height:40px;flex:none;display:grid;place-items:center;background:transparent;border:1px solid transparent;border-radius:12px;transition:.15s;color:var(--mut)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{color:var(--tx);background:#ffffff10}.ib.on{color:var(--cy);background:#22d3ee1f;border-color:var(--cy);box-shadow:0 0 14px #22d3ee40}.ib:active{transform:scale(.92)}
.ib.zt{width:auto;padding:0 8px;font:600 12px var(--mono)}
.sp{width:1px;height:24px;background:var(--ln);flex:none;margin:0 4px}
#penpop{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;padding:8px 12px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff3;padding:0;transition:.15s}.sw.on{border-color:#fff;transform:scale(1.2);box-shadow:0 0 12px currentColor}
.wd{width:30px;height:30px;border-radius:9px;border:1px solid var(--ln);background:transparent;display:grid;place-items:center;padding:0}.wd i{display:block;border-radius:50%;background:var(--tx)}.wd.on{border-color:var(--cy);background:#22d3ee22}
#planets{position:fixed;z-index:6;left:calc(14px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-46%);display:flex;flex-direction:column;align-items:center;gap:15px}
.pl{--h:#fff;--m:#999;--l:#222;--g:#fff4;--r:#fff9;position:relative;width:36px;height:36px;border-radius:50%;border:0;padding:0;flex:none;background:radial-gradient(circle at 30% 28%,var(--h),var(--m) 50%,var(--l) 100%);box-shadow:inset -7px -7px 12px #000a,0 0 18px var(--g);transition:transform .25s,box-shadow .25s;animation:bob 6s ease-in-out infinite}
.pl:nth-child(2n){animation-delay:-2s}.pl:nth-child(3n){animation-delay:-4s}
@keyframes bob{50%{translate:0 -3px}}
.pl:hover,.pl:focus-visible{transform:scale(1.2);box-shadow:inset -7px -7px 12px #000a,0 0 28px var(--g)}
.pl.big{width:54px;height:54px}
.pl.ring::after{content:"";position:absolute;left:-34%;right:-34%;top:36%;bottom:36%;border:2px solid var(--r);border-radius:50%;transform:rotate(-24deg);box-shadow:0 0 8px var(--r);pointer-events:none}
.pl.ring2::before{content:"";position:absolute;left:-52%;right:-52%;top:33%;bottom:33%;border:1.5px solid #ffffff55;border-radius:50%;transform:rotate(-24deg);pointer-events:none}
.pl.orbit::after{content:"";position:absolute;inset:-9px;border:1.5px dashed var(--r);border-radius:50%;animation:spin 9s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.pl.stk{background:radial-gradient(circle at 30% 28%,#ffffff66,transparent 40%),repeating-linear-gradient(0deg,#15803d 0 5px,#22c55e 5px 9px,#86efac 9px 12px,#14532d 12px 15px)}
.pl.que{background:radial-gradient(circle at 30% 28%,#ffffff66,transparent 40%),repeating-linear-gradient(90deg,#c2410c 0 5px,#fb923c 5px 9px,#fde68a 9px 12px,#7c2d12 12px 15px)}
.pl.bt{background:radial-gradient(circle at 70% 62%,#0004 0 7%,transparent 8%),radial-gradient(circle at 36% 70%,#0003 0 5%,transparent 6%),radial-gradient(circle at 30% 28%,var(--h),var(--m) 50%,var(--l) 100%)}
.pl i{position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%);white-space:nowrap;font:500 12px var(--ui);font-style:normal;padding:4px 9px;border-radius:8px;background:var(--glass2);border:1px solid var(--ln);opacity:0;pointer-events:none;transition:.2s;color:var(--tx);animation:none}
.pl.big i{left:calc(100% + 18px)}
.pl:hover i,.pl:focus-visible i,#planets.show .pl i{opacity:1}
#learn{position:fixed;z-index:6;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(310px,calc(100% - 24px));padding:14px;display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 150px);overflow:auto}
#learn h3{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
#learn .dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 12px currentColor}
#learn .x{margin-left:auto;background:none;border:0;color:var(--mut);font-size:18px;padding:0 4px}
#learn p{margin:0;color:var(--mut);font-size:12.5px;line-height:1.5}
#learn .ops{display:flex;flex-wrap:wrap;gap:6px}
#learn .row{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px}
#learn .cx{font:500 11px var(--mono);color:#9fb0e8;line-height:1.5}
#menu,#menu2{position:fixed;display:none;z-index:50;min-width:200px;max-height:82vh;overflow:auto;padding:5px;background:var(--glass2);border:1px solid var(--ln);border-radius:14px;box-shadow:0 14px 50px #000c;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#menu2{z-index:51}
.mi{display:flex;justify-content:space-between;gap:18px;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.mi:hover,.mi:focus{background:#22d3ee22;outline:0}.mi kbd{font:500 11px var(--mono);color:var(--mut)}
.mh{padding:7px 12px 3px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--vi)}
#menu hr,#menu2 hr{border:0;border-top:1px solid var(--ln);margin:4px 2px}
#toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cy);color:#00131a;padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;font-weight:600;max-width:90%;text-align:center}
#empty{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut);pointer-events:none;text-align:center;padding:20px 20px 90px}
#empty h1{margin:0;font-size:46px;letter-spacing:5px;font-weight:600;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
#empty p{margin:0;max-width:380px;line-height:1.55;color:#b4bfee}
#empty .eb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}#empty button{pointer-events:auto}
#dlg,#mdl{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:80;backdrop-filter:blur(5px);padding:16px}
#dlg[hidden],#mdl[hidden]{display:none}
.box{background:var(--glass2);border:1px solid var(--cy);border-radius:18px;padding:18px;width:min(380px,100%);box-shadow:0 0 40px #22d3ee33;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.box.wide{width:min(560px,100%)}
.box input,.box textarea{background:#070a1c;color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:15px var(--mono);width:100%}
.box textarea{height:200px;resize:vertical;font-size:12px}
.box .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.box h3{margin:0}.box table{border-collapse:collapse;width:100%}.box td{padding:4px 6px;border-bottom:1px solid var(--ln);vertical-align:top;font-size:13px}.box td:first-child{font-family:var(--mono);color:var(--cy);white-space:nowrap}
.box img{max-width:100%;border-radius:10px;background:#04050d}
@media(max-width:700px){#info{max-width:calc(100% - 24px);top:calc(58px + env(safe-area-inset-top,0px))}#selbar{top:calc(108px + env(safe-area-inset-top,0px))}.pl{width:32px;height:32px}.pl.big{width:46px;height:46px}#planets{gap:12px}#empty h1{font-size:34px}}
@media(max-height:560px){#planets{gap:8px;transform:translateY(-50%)}.pl{width:28px;height:28px}.pl.big{width:38px;height:38px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<style>
text{font-family:'Outfit',system-ui,sans-serif;fill:#e6ebff;font-size:13px;pointer-events:none}.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.nb{fill:url(#gN);stroke:#5b7fae;stroke-width:1.5}.sel .nb,.sel .pb,.sel .ab,.sel .zb,.sel .ab2{stroke:#f472b6;stroke-width:2.5;filter:drop-shadow(0 0 7px #f472b6)}
.hl .nb{stroke:#fbbf24;stroke-width:3.2;filter:drop-shadow(0 0 14px #fbbf24)}.hl .pb{stroke:#fbbf24;stroke-width:2.6;filter:drop-shadow(0 0 12px #fbbf24)}
.cap{fill:#cfe6ff;font-size:10px;opacity:.75}.dv{font-size:21px;font-weight:700;text-anchor:middle}.sep{stroke:#bfe0ff;stroke-opacity:.65;stroke-width:1.5}.cell{fill:url(#gC);stroke:#bfe0ff;stroke-opacity:.55;stroke-width:1.5}.tb{fill:url(#gB);stroke:#bfe0ff;stroke-opacity:.5}.tt{fill:#eef7ff;font-size:13px}.hw{font-family:'Kalam','Segoe Print','Bradley Hand','Comic Sans MS',cursive}.xx{stroke:#eaf4ff;stroke-width:3.5;stroke-linecap:round;fill:none}.ad{fill:#e9fcff;font-size:13px;filter:drop-shadow(0 0 4px #22d3ee)}.ab2{fill:#22d3ee18;stroke:none}.nodeg{filter:drop-shadow(0 0 14px #3b82f655)}
.fl{fill:none;stroke:#fff;stroke-width:2.2;stroke-dasharray:1 17;stroke-linecap:round;animation:fl 1s linear infinite;pointer-events:none}@keyframes fl{to{stroke-dashoffset:-18}}@media(prefers-reduced-motion:reduce){.fl{animation:none}}
.pb{fill:url(#gP);stroke:#a78bfa;stroke-width:1.5;filter:drop-shadow(0 0 8px #a78bfa99)}.ab{fill:#0f2a33;stroke:#22d3ee;stroke-dasharray:4 3}
.zb{fill:#2a1030;stroke:#f472b6;stroke-dasharray:3 3}.zt{fill:#f472b6;font-weight:700;letter-spacing:1px}
.hd{fill:#0b1020;stroke:#22d3ee;stroke-width:2;r:7;cursor:crosshair}.hd.p{stroke:#a78bfa}.hd.on{fill:#22d3ee}.hd.nul{opacity:.02}
@media(pointer:coarse){.hd{r:11}}
.ln{fill:none;stroke:#22d3ee;stroke-width:2;pointer-events:none}.lp .ln{stroke:#a78bfa}.on .ln{stroke:#f472b6;stroke-width:3.5;filter:drop-shadow(0 0 5px #f472b6)}
.hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}.eh{fill:#0b1020;stroke:#f472b6;stroke-width:2;r:6;opacity:0;cursor:grab}.on .eh,.lk:hover .eh{opacity:1}
.tmp{fill:none;stroke:#f472b6;stroke-width:2;stroke-dasharray:6 4;pointer-events:none}.hint{fill:none;stroke:#f472b6;stroke-width:2;stroke-dasharray:3 3;pointer-events:none}
.xb{opacity:0;transition:.15s}.xb circle{fill:#1a0d2e;stroke:#f472b6;stroke-width:1.6;r:10;cursor:pointer}.xb path{stroke:#f472b6;stroke-width:2.2;fill:none;pointer-events:none;stroke-linecap:round}.lk:hover .xb,.on .xb{opacity:1}@media(pointer:coarse){.xb{opacity:.85}}
.dim{opacity:.18}g.it{cursor:grab}
.ink{fill:none;stroke-linecap:round;stroke-linejoin:round}.inkhit{fill:none;stroke:transparent;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}.inksel{fill:none;stroke:#f472b6;stroke-opacity:.55;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px #f472b6)}
.mq{fill:#22d3ee14;stroke:#22d3ee;stroke-width:1.4;stroke-dasharray:6 4;pointer-events:none}
</style>

<style id="ga-css">
/* ===== GalaxAlgo additions: intro, auth, responsive ===== */
#ia{position:fixed;inset:0;z-index:200;background:#02030a;overflow:hidden;transition:opacity 1.1s ease,transform 1.3s cubic-bezier(.5,0,.2,1),filter 1.1s;touch-action:manipulation}
#ia.out{opacity:0;transform:scale(1.25);filter:blur(6px);pointer-events:none}
#ia.fast{transition-duration:.45s}
#ic{position:absolute;inset:0;width:100%;height:100%}
#ia::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#000d 100%)}
#it{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:20px}
#it small{font:500 clamp(12px,2.6vw,18px) var(--ui);letter-spacing:.5em;padding-left:.5em;text-transform:uppercase;color:#a5f3fc;opacity:0;transform:translateY(10px);margin-bottom:12px}
#it h1{margin:0;display:flex;font:600 clamp(38px,12vw,120px)/1.05 var(--ui);letter-spacing:.04em;white-space:nowrap;filter:drop-shadow(0 0 24px #22d3ee88)}
#it h1 span{display:inline-block;padding-bottom:.14em;opacity:0;filter:blur(18px);transform:translateY(24px) scale(1.4);background:linear-gradient(180deg,#fff,#22d3ee 55%,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}

<script>

 S.nulls.forEach(z=>{if(z.att){const n=byId(z.att.n),f=n&&n.f[z.att.f];if(!f||f.to!=z.id)z.att=null;else{z.x=n.x+NW(n)+54;z.y=n.y+CY-12+(z.att.f-(n.f.length-1))*30}}})}
function hlSet(){const s=new Set(),k=new Set(),c=cur();if(!c)return{s,k};
 if(c.t=='l'){k.add(c.k);const o=getO(srcOf(c.k));s.add(srcOf(c.k).id);o&&s.add(o.to)}
 else if(c.t=='p'){const p=byId(c.id);s.add(c.id);if(p&&p.to){s.add(p.to);k.add('p:'+p.id)}}

  if(l.src.t=='p'&&tg.id[0]=='n'&&sp.y+40<tg.y){a={x:sp.x+55,y:sp.y+28};b={x:tg.x+NW(tg)/2,y:tg.y};const dy=Math.max(40,(b.y-a.y)/2);LM={x:(a.x+b.x)/2,y:(a.y+b.y)/2};d=`M${a.x} ${a.y}C${a.x} ${a.y+dy},${b.x} ${b.y-dy},${b.x} ${b.y}`}

  else d=path(a,b,sd,l.o.st);const M=LM,on=k.has(l.key)||selLink==l.key;
  g+=`<g class="lk ${l.src.t=='p'?'lp':''}${on?' on':''}${cfg.focus&&(SEL.size||selLink)&&!on?' dim':''}"><path class="hit" data-t="l" data-k="${l.key}" d="${d}"/><path class="ln" d="${d}" marker-end="url(#m${on?'h':l.src.t=='p'?'p':'f'})"/><path class="fl" d="${d}"/><circle class="eh" data-t="l" data-k="${l.key}" data-h="1" cx="${b.x}" cy="${b.y}"/><g class="xb" data-t="l" data-x="1" data-k="${l.key}" transform="translate(${M.x} ${M.y})"><circle/><path d="M-3.5 -3.5L3.5 3.5M3.5 -3.5L-3.5 3.5"/></g></g>`}

function explain(){if(marq)return'Release to select everything inside the box';if(pend)return'Click the destination node or NULL marker… (Esc to cancel)';
